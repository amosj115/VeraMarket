services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera_dev_password
      POSTGRES_DB: vera_market
    ports:
      - "5432:5432"
    volumes:
      - vera_pg_data:/var/lib/postgresql/data

volumes:
  vera_pg_data:
